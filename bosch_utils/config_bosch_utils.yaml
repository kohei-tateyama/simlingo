# Base recording output directory (keeps existing behavior)
# RECORDING_OUTPUT_DIR: /workspace/simlingo/recording_japan_xml
RECORDING_OUTPUT_DIR: /media/external_ssd # this is the Kohei ssd we canb use 4 TB
NEW_SIMLINGO_MATCH: /workspace/simlingo/database/simlingo_v4_bosch_2025_01_10/data/simlingo
DEFAULT_RUN_DIR: /workspace/simlingo/recording_japan_xml/database/simlingo_v3_2026_01_01/auto_long_multicam_jp/training_Town13_scenario/routes_highway_duration_20_training/SoftRainNight_weather/ego_43
# Default comparison folders (used by comparison tools)
DEFAULT_SIM: /workspace/simlingo/database/simlingo_v2_2025_01_10/data/simlingo/training_1_scenario/routes_training/random_weather_seed_1_balanced_150/Town12_Rep0_1000_route0_01_11_15_39_27
DEFAULT_OURS: /workspace/simlingo/recording_japan_xml/database/simlingo_v3_2026_01_01/auto_long_multicam_jp/training_Town13_scenario/routes_highway_duration_10_training/SoftRainNight_weather/ego_43
CARLA_HOST: localhost
CARLA_PORT: 2000
CARLA_TIMEOUT: 10.0
VEHICLE_MODEL: vehicle.toyota.prius  
SIMLINGO_VERSION_DIR: simlingo_v5_2026_01_05
TRAFFIC_MANAGER_PORT: 8000
PRINT_LENGTH: 70
AUTOPILOT: true
WEATHER_PRESET: 10
ROUTE_TYPE: highway # urban, classic 
SIMULATION_DURATION_SECS: 600
FPS: 20 
NUM_CAMERAS: 6
CAMERA_IMAGE_WIDTH: 800
CAMERA_IMAGE_HEIGHT: 600
CAMERA_FOV: 90
METER_TO_SECOND: 2.77778  # 1 km/h = 0.277778 m/s
SECONDS_TO_HOURS: 3600.0
METER_TO_SECOND_TO_KMH: 3.6  # 1 m/s = 3.6 km/h

IMAGE_SIZE_X: 1024
IMAGE_SIZE_Y: 512

FORMAT_IMGS: PNG  # JPG
CAM_NAMES: ['F','B','RF','LF','RB','LB']
NAME_PATCHED: 'patched'

CAMERA_POSITIONS:
  -F:
    - x: 2.5
      y: 0.0
      z: 1.5    
      pitch: 0.0
      yaw: 0.0
      roll: 0.0
      name: 'Front'
  -B:
    - x: -2.5
      y: 0.0
      z: 1.5    
      pitch: 0.0
      yaw: 180.0
      roll: 0.0
      name: 'Back'
  -LB:
    - x: -1.0
      y: -1.0  
      z: 1.5  
      pitch: 0.0
      yaw: -125.0
      roll: 0.0
      name: 'Left Back'
  -RF:
    - x: 1.0
      y: 1.0
      z: 2.5    
      pitch: 0.0
      yaw: 55.0
      roll: 0.0 
      name: 'Right Front'
  -RB:
    - x: -1.0
      y: 1.0
      z: 1.5  
      pitch: 0.0  
      yaw: 125.0
      roll: 0.0
      name: 'Right Back'
  -LF:
    - x: 1.0
      y: -1.0  
      z: 1.5  
      pitch: 0.0  
      yaw: -55.0
      roll: 0.0
      name: 'Left Front'


AUTOSAVE_SECS: 300
ROTATE_SECS: 0
REPEAT: 1
NUM_IMGS_PER_FRAME: 6 

## PATCH CAMERA CONFIG
VEHICLE_LENGTH: 5.0  # meters
VEHICLE_WIDTH: 2.0   # meters
HORIZONTAL_MULT: 3.25  # >1 moves left/right cameras further out (increased per request)
VERTICAL_MULT: 0.6   # <1 brings front/back cameras closer to center
LEFT_VERTICAL_SPREAD: 1.5
RIGHT_VERTICAL_SPREAD: 1.5
IMAGE_SCALE_MULTIPLIER: 1.08

## WEATHER 
PRESETS: ['ClearNoon', 'CloudyNoon', 'WetNoon', 'WetCloudyNoon',
        'SoftRainNoon', 'MidRainyNoon', 'HardRainNoon',
        'ClearSunset', 'CloudySunset', 'WetSunset', 'WetCloudySunset',
        'SoftRainSunset', 'MidRainSunset', 'HardRainSunset',
        'ClearNight', 'CloudyNight', 'WetNight', 'WetCloudyNight',
        'SoftRainNight', 'MidRainyNight', 'HardRainNight','DustStorm']

IMAGE_FORMAT: 'JPG'
JPG_QUALITY: 85
PNG_COMPRESS_LEVEL: 9 # (9 = max compression)

# PLOTS
LINE_WIDTH: 3
FONT_SIZE: 14
FONT_SIZE_TITLE: 16
ALPHA_GRID : 0.7
ALPHA_LEGEND: 0.3

# LEFT HAND TRAFFIC
SET_GLOBAL_DISTANCE_TO_LEADING_VEHICLE: 2.5
MARGIN: 0.1
GLOBAL_LANE_OFFSET: -0.8

DEFAULT_LANE_W: 3.5
DEFAULT_VEHICLE_HALF_W: 0.9
MIN_SAFE_DISTANCE_SAFE: 0.02
MAX_SAFE_DISTANCE_SAFE: 2.0
MAX_DISTANCE_SAFE: 2.5
MIN_DISTANCE_SAFE: -2.5
NPC_VEHICLE_NUMBER: 30

MAX_DETECT_INFRASTRUCTURE_OFFSET: 50.0
MIN_NORMALIZATION_SCALE: 0.001
OFFSET_1: 0.7
OFFSET_2: 0.3

SAMPLING_RESOLUTION: 2.0
AVERAGE_SPEEDS_MPS: 11.1

MIN_DISTANCE_TARGET: 0.7
MAX_DISTANCE_TARGET: 1.5
NEARBY_POINTS: 50.0